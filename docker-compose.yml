
services:
  # Servidor Apache + PHP
  web:
    build: .
    container_name: checkpoint_php
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db

  # Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: checkpoint_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: meu_banco
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senha_usuario
    volumes:
      - ./mysql-data:/var/lib/mysql # PERSISTÊNCIA DENTRO DO PROJETO
    ports:
      - "3307:3306"

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: checkpoint_phpmyadmin
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8888:80"
